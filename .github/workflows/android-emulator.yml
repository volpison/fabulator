# Starts the app in an Android TABLET EMULATOR and keeps a screenshot and the log, so the app can be
# checked without a physical device. It never publishes anything.
# Run it by hand: Actions → "Android emulator check" → Run workflow, then download "emulator-check".
name: Android emulator check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-emulator.yml"

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The emulator runs on x86_64, so this build targets x86_64 (the phone/tablet APK is ARM).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm install

      - name: Create the Android project
        run: npm run tauri android init

      # Make the on-screen keyboard resize the page (see the script).
      - name: Patch the Android project
        run: bash scripts/android-patch.sh

      - name: Build a debug APK for the emulator
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm run tauri android build -- --debug --apk --target x86_64

      # A project file to open through the real Android file picker.
      - name: Make a sample project file
        run: |
          mkdir -p emulator-in
          node --experimental-strip-types --no-warnings --import ./tests/register.mjs scripts/make-sample-project.ts emulator-in/Imported.fabulator.json

      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start a tablet emulator, install and open the app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: Nexus 10
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/android-emulator-check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-check
          path: emulator-out/
          if-no-files-found: warn

      # Keep the screenshot where it can be looked at: a throwaway branch, never merged.
      - name: Save the screenshot on the ci-emulator branch
        if: always() && github.event.pull_request.head.repo.full_name == github.repository || always() && github.event_name == 'workflow_dispatch'
        run: |
          [ -f emulator-out/start.png ] || exit 0
          mkdir -p /tmp/shots && cp emulator-out/*.png emulator-out/summary.txt /tmp/shots/
          cd /tmp/shots
          git init -q -b ci-emulator
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Emulator screenshot for run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-emulator
